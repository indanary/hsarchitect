name: Build & Deploy Astro to cPanel

on:
    workflow_dispatch:
        inputs:
            deploy:
                description: "Deploy after build (true/false)"
                required: false
                default: "true"
            slugs:
                description: "JSON array of slugs to prerender"
                required: false
                default: "[]"
    repository_dispatch:
        types: [rebuild]

concurrency:
    group: build-deploy-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            # Accept slugs from repository_dispatch (backend-triggered)
            - name: Prepare prerender payload (from repository_dispatch)
              if: github.event_name == 'repository_dispatch' && github.event.client_payload != ''
              run: |
                  echo "Client payload: ${{ toJson(github.event.client_payload) }}"
                  echo "${{ toJson(github.event.client_payload.slugs) }}" > .prerender_payload.json
                  echo "PRERENDER_SLUGS=${{ toJson(github.event.client_payload.slugs) }}" >> $GITHUB_ENV

            # Accept slugs from workflow_dispatch (manual run with inputs)
            - name: Inject slugs from workflow_dispatch
              if: github.event_name == 'workflow_dispatch' && github.event.inputs.slugs != ''
              run: |
                  echo '${{ github.event.inputs.slugs }}' > .prerender_payload.json
                  echo "PRERENDER_SLUGS=${{ github.event.inputs.slugs }}" >> $GITHUB_ENV

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            # For production, prefer locked installs. Ensure lockfile was generated on Linux.
            - name: Install dependencies (npm ci)
              run: npm ci

            - name: Prepare prerender file
              run: npm run prepare:prerender
              env:
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            - name: Build Astro
              run: npm run build
              env:
                  NODE_ENV: production
                  PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            - name: Sanity check build output
              run: |
                  test -d dist && echo "dist folder exists."
                  test -f dist/index.html || echo "Note: no top-level index.html (may be routed-only site)."
                  # Fail if dist is empty:
                  [ "$(ls -A dist | wc -l)" -gt 0 ]

            # Deploy only from prod branch and only when requested
            - name: Ensure FTP secrets set
              if: >
                  (github.ref_name == 'prod') && (github.event_name == 'repository_dispatch' ||
                   (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'))

              run: |
                  if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
                    echo "::error::Missing one or more FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD)."
                    exit 1
                  fi

            - name: Deploy via FTPS (production)
              if: >
                  (github.ref_name == 'prod') && (github.event_name == 'repository_dispatch' ||
                   (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'))

              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.FTP_SERVER }} # e.g. ftp.hsarchitect.id
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  protocol: ftps
                  local-dir: dist/ # must end with '/'
                  server-dir: public_html/ # PRODUCTION target
                  exclude: |
                      admin/**
                      admin/**/*
                      .well-known/**

            - name: Done
              run: echo "✅ Production build (and deploy if enabled) finished"
