name: Build & Deploy Astro to cPanel

on:
    workflow_dispatch:
        inputs:
            deploy:
                description: 'Set to "true" to perform FTPS deploy after build (default: false for safety)'
                required: false
                default: "false"
    repository_dispatch:
        types: [rebuild]

concurrency:
    group: build-deploy-${{ github.ref_name || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Prepare prerender payload (from repository_dispatch)
              if: github.event_name == 'repository_dispatch' && github.event.client_payload != ''
              run: |
                  echo "Client payload: ${{ toJson(github.event.client_payload) }}"
                  # Write the slugs array (if provided) to a file for the prepare script to consume
                  echo "${{ toJson(github.event.client_payload.slugs) }}" > .prerender_payload.json
                  # Set PRERENDER_SLUGS env for compatibility; GitHub will treat this as a string (JSON array or CSV)
                  echo "PRERENDER_SLUGS=${{ toJson(github.event.client_payload.slugs) }}" >> $GITHUB_ENV

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Clean install (fix rollup optional deps on CI)
              run: |
                  # Remove lockfile + node_modules and install fresh on runner to ensure platform-specific optional deps are resolved correctly
                  rm -rf node_modules package-lock.json
                  npm install

            - name: Prepare prerender file
              run: npm run prepare:prerender
              # ensure PRERENDER_SLUGS is available to the script if set by dispatch
              env:
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            - name: Build Astro
              run: npm run build
              env:
                  NODE_ENV: production
                  PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            # Optional deploy: guarded so you can run build-only
            - name: Ensure FTP secrets set
              if: >
                  github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')


              run: |
                  if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
                    echo "::error::Missing one or more FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD). Set them in Repo Settings -> Secrets and Variables -> Actions."
                    exit 1
                  fi

            - name: Deploy via FTPS (safe test folder)
              if: >
                  github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')


              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.FTP_SERVER }} # e.g. ftp.hsarchitect.id
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  protocol: ftps
                  local-dir: dist/ # must end with '/'
                  # default is test folder so you don't overwrite production unintentionally
                  server-dir: public_html/test-deploy/
                  # Keep your admin dashboard / other assets intact
                  exclude: |
                      admin/**
                      admin/**/*
                      .well-known/**

            - name: Done
              run: echo "✅ Build (and optional deploy) finished"
