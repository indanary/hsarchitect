name: Build & Deploy Astro to cPanel

on:
    workflow_dispatch:
        inputs:
            deploy:
                description: 'Set to "true" to perform FTPS deploy (default true)'
                required: false
                default: "true"
    repository_dispatch:
        types: [rebuild]

concurrency:
    group: build-deploy-${{ github.ref_name || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read

jobs:
    build-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Clean install (fix rollup optional deps)
              run: |
                  rm -rf node_modules package-lock.json
                  npm install

            - name: Build Astro
              run: npm run build
              env:
                  NODE_ENV: production
                  PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}

            - name: Ensure FTP secrets set
              if: >
                  github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')


              run: |
                  if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
                    echo "::error::Missing one or more FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD)."
                    exit 1
                  fi

            - name: Upload via lftp (explicit FTPS :21, test folder)
              if: >
                  github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')


              env:
                  FTP_SERVER: ${{ secrets.FTP_SERVER }}
                  FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
                  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y lftp
                  # Upload dist/ to a test folder first. Change public_html/test-deploy/ => public_html/ when ready.
                  lftp -d -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
                    set net:prefer-ipv4 true;
                    set ftp:ssl-force true;
                    set ftp:ssl-protect-data true;
                    set ssl:verify-certificate no;   # remove or replace with proper CA in production
                    set ftp:passive-mode true;
                    set net:timeout 20;
                    set net:max-retries 2;
                    mirror -R --verbose dist/ public_html/test-deploy/;
                    quit
                  " ftps://$FTP_SERVER:21

            - name: Done
              run: echo "Build (and optional deploy) finished"
