name: Build & Deploy Astro to cPanel

on:
    workflow_dispatch:
        inputs:
            deploy:
                description: "Deploy after build (true/false)"
                required: false
                default: "true"
            slugs:
                description: "JSON array of slugs to prerender"
                required: false
                default: "[]"
    repository_dispatch:
        types: [rebuild]

concurrency:
    group: build-deploy-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Prepare prerender payload (from repository_dispatch)
              if: github.event_name == 'repository_dispatch' && github.event.client_payload != ''
              run: |
                  echo "Client payload: ${{ toJson(github.event.client_payload) }}"
                  echo "${{ toJson(github.event.client_payload.slugs) }}" > .prerender_payload.json
                  echo "PRERENDER_SLUGS=${{ toJson(github.event.client_payload.slugs) }}" >> $GITHUB_ENV

            - name: Inject slugs from workflow_dispatch
              if: github.event_name == 'workflow_dispatch' && github.event.inputs.slugs != ''
              run: |
                  echo '${{ github.event.inputs.slugs }}' > .prerender_payload.json
                  echo "PRERENDER_SLUGS=${{ github.event.inputs.slugs }}" >> $GITHUB_ENV

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Clean install for Linux (rollup fix)
              run: |
                  rm -rf node_modules package-lock.json
                  npm install --no-audit --no-fund

            - name: Prepare prerender file
              run: npm run prepare:prerender
              env:
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            - name: Build Astro
              run: npm run build
              env:
                  NODE_ENV: production
                  PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            - name: Sanity check build output
              run: |
                  test -d dist && echo "dist folder exists."
                  [ "$(ls -A dist | wc -l)" -gt 0 ] || (echo "dist is empty" && exit 1)

            - name: Deploy via lftp (robust FTPS with fallbacks)
              if: >
                  (github.ref_name == 'prod') && (github.event_name == 'repository_dispatch' ||
                   (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'))

              env:
                  FTP_SERVER: ${{ secrets.FTP_SERVER }} # e.g. ftp.hsarchitect.id
                  FTP_USERNAME: ${{ secrets.FTP_USERNAME }} # e.g. hsadmin@hsarchitect.id
                  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
              run: |
                  set -euo pipefail

                  if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
                    echo "::error::Missing one or more FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD)."
                    exit 1
                  fi

                  sudo apt-get update
                  sudo apt-get install -y lftp dnsutils

                  # Prefer IPv4
                  HOST_IP="$(dig +short A "$FTP_SERVER" | head -n1 || true)"
                  if [ -z "$HOST_IP" ]; then
                    echo "No A record; using hostname $FTP_SERVER"
                    HOST="$FTP_SERVER"
                  else
                    echo "Resolved $FTP_SERVER => $HOST_IP"
                    HOST="$HOST_IP"
                  fi

                  lftp_ls() {
                    local url="$1"
                    echo "Testing list on: $url"
                    lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
                      set cmd:fail-exit true;
                      set ftp:passive-mode true;
                      set ftp:prefer-epsv false;
                      set ssl:session-reuse off;
                      set ftp:ssl-force true;
                      set ftp:ssl-protect-data true;
                      set ssl:verify-certificate no;
                      set net:timeout 20;
                      set net:max-retries 1;
                      ls;
                      quit
                    " "$url"
                  }

                  lftp_upload() {
                    local url="$1"
                    echo "Uploading via: $url"
                    lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
                      set cmd:fail-exit true;
                      set ftp:passive-mode true;
                      set ftp:prefer-epsv false;
                      set ssl:session-reuse off;
                      set ftp:ssl-force true;
                      set ftp:ssl-protect-data true;
                      set ssl:verify-certificate no;   # remove if cert chain is valid
                      set net:timeout 30;
                      set net:max-retries 2;
                      mirror -R --verbose dist/ public_html/;
                      quit
                    " "$url"
                  }

                  # 1) Explicit FTPS on 21
                  if lftp_ls "ftps://$HOST:21"; then
                    lftp_upload "ftps://$HOST:21"
                    exit 0
                  else
                    echo "FTPS 21 failed to list. Trying implicit FTPS 990…"
                  fi

                  # 2) Implicit FTPS on 990
                  if lftp_ls "ftps://$HOST:990"; then
                    lftp_upload "ftps://$HOST:990"
                    exit 0
                  else
                    echo "FTPS 990 failed to list. Trying plain FTP 21 (last resort)…"
                  fi

                  # 3) Plain FTP (last resort - insecure)
                  echo "Testing list on: ftp://$HOST:21"
                  if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
                        set cmd:fail-exit true;
                        set ftp:passive-mode true;
                        set ftp:prefer-epsv false;
                        set net:timeout 20;
                        set net:max-retries 1;
                        ls;
                        quit
                      " "ftp://$HOST:21"; then
                    echo "Uploading via: ftp://$HOST:21"
                    lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
                      set cmd:fail-exit true;
                      set ftp:passive-mode true;
                      set ftp:prefer-epsv false;
                      set net:timeout 30;
                      set net:max-retries 2;
                      mirror -R --verbose dist/ public_html/;
                      quit
                    " "ftp://$HOST:21"
                    exit 0
                  fi

                  echo "::error::All connection attempts failed. If FTPS still fails, ask the host to confirm protocol (explicit 21 vs implicit 990) and ensure passive port range is open. Consider SFTP instead."
                  exit 1

            - name: Done
              run: echo "✅ Production build (and deploy if enabled) finished"
