name: Build & Deploy Astro to cPanel

on:
    workflow_dispatch:
        inputs:
            deploy:
                description: "Deploy after build (true/false)"
                required: false
                default: "true"
            slugs:
                description: "JSON array of slugs to prerender"
                required: false
                default: "[]"
    repository_dispatch:
        types: [rebuild]

concurrency:
    group: build-deploy-${{ github.ref_name || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # Accept slugs from repository_dispatch (backend-triggered)
            - name: Prepare prerender payload (from repository_dispatch)
              if: github.event_name == 'repository_dispatch' && github.event.client_payload != ''
              run: |
                  echo "Client payload: ${{ toJson(github.event.client_payload) }}"
                  echo "${{ toJson(github.event.client_payload.slugs) }}" > .prerender_payload.json
                  echo "PRERENDER_SLUGS=${{ toJson(github.event.client_payload.slugs) }}" >> $GITHUB_ENV

            # Accept slugs from workflow_dispatch (manual run with inputs)
            - name: Inject slugs from workflow_dispatch
              if: github.event_name == 'workflow_dispatch' && github.event.inputs.slugs != ''
              run: |
                  echo '${{ github.event.inputs.slugs }}' > .prerender_payload.json
                  echo "PRERENDER_SLUGS=${{ github.event.inputs.slugs }}" >> $GITHUB_ENV

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            # Safer install on Linux runners to avoid optional-deps (rollup) issues
            - name: Clean install (fix rollup optional deps on CI)
              run: |
                  rm -rf node_modules package-lock.json
                  npm install

            - name: Prepare prerender file
              run: npm run prepare:prerender
              env:
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            - name: Build Astro
              run: npm run build
              env:
                  NODE_ENV: production
                  PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            # Optional deploy: guarded so you can run build-only
            - name: Ensure FTP secrets set
              if: >
                  github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')


              run: |
                  if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
                    echo "::error::Missing one or more FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD). Set them in Repo Settings -> Secrets and Variables -> Actions."
                    exit 1
                  fi

            - name: Deploy via FTPS (safe test folder)
              if: >
                  github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')


              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.FTP_SERVER }} # e.g. ftp.hsarchitect.id
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  protocol: ftps
                  local-dir: dist/ # must end with '/'
                  server-dir: public_html/test-deploy/ # change to public_html/ when ready
                  exclude: |
                      admin/**
                      admin/**/*
                      .well-known/**

            - name: Done
              run: echo "✅ Build (and optional deploy) finished"
