name: Build & Deploy Astro to cPanel

# triggers
on:
    workflow_dispatch:
        inputs:
            deploy:
                description: 'Set to "true" to perform FTPS deploy (default false)'
                required: false
                default: "false"
    repository_dispatch:
        types: [rebuild]

concurrency:
    group: build-deploy-${{ github.ref_name || github.sha }}
    cancel-in-progress: true

# GITHUB_TOKEN permissions for this workflow (minimal)
permissions:
    contents: read
    actions: read

jobs:
    build-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Clean install (fix rollup optional deps)
              run: |
                  rm -rf node_modules package-lock.json
                  npm install

            - name: Build Astro
              run: npm run build
              env:
                  NODE_ENV: production
                  PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}

            # Deploy via FTPS - guarded so you can test build-only
            - name: Deploy via FTPS
              if: >
                  github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')


              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.FTP_SERVER }} # e.g. ftp.hsarchitect.id
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  protocol: ftps
                  local-dir: dist/
                  server-dir: public_html
                  exclude: |
                      admin/**
                      admin/**/*
                      .well-known/**

            - name: Done
              run: echo "Build (and optional deploy) finished"
