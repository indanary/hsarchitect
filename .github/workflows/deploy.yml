name: Build & Deploy Astro to cPanel

on:
    workflow_dispatch:
        inputs:
            deploy:
                description: "Deploy after build (true/false)"
                required: false
                default: "true"
            slugs:
                description: "JSON array of slugs to prerender"
                required: false
                default: "[]"
    repository_dispatch:
        types: [rebuild]

concurrency:
    group: build-deploy-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Prepare prerender payload (from repository_dispatch)
              if: github.event_name == 'repository_dispatch' && github.event.client_payload != ''
              run: |
                  echo "Client payload: ${{ toJson(github.event.client_payload) }}"
                  echo "${{ toJson(github.event.client_payload.slugs) }}" > .prerender_payload.json
                  echo "PRERENDER_SLUGS=${{ toJson(github.event.client_payload.slugs) }}" >> $GITHUB_ENV

            - name: Inject slugs from workflow_dispatch
              if: github.event_name == 'workflow_dispatch' && github.event.inputs.slugs != ''
              run: |
                  echo '${{ github.event.inputs.slugs }}' > .prerender_payload.json
                  echo "PRERENDER_SLUGS=${{ github.event.inputs.slugs }}" >> $GITHUB_ENV

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Clean install for Linux (rollup fix)
              run: |
                  rm -rf node_modules package-lock.json
                  npm install --no-audit --no-fund

            - name: Prepare prerender file
              run: npm run prepare:prerender
              env:
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            - name: Build Astro
              run: npm run build
              env:
                  NODE_ENV: production
                  PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
                  PRERENDER_SLUGS: ${{ env.PRERENDER_SLUGS || '' }}

            - name: Sanity check build output
              run: |
                  test -d dist && echo "dist folder exists."
                  [ "$(ls -A dist | wc -l)" -gt 0 ] || (echo "dist is empty" && exit 1)

            # Deploy only from prod branch and when requested
            - name: Ensure FTP secrets set
              if: >
                  (github.ref_name == 'prod') && (github.event_name == 'repository_dispatch' ||
                   (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'))


              run: |
                  if [ -z "${{ secrets.FTP_SERVER }}" ] || [ -z "${{ secrets.FTP_USERNAME }}" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
                    echo "::error::Missing one or more FTP secrets (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD)."
                    exit 1
                  fi

            - name: Deploy via lftp (explicit FTPS :21, passive)
              if: >
                  (github.ref_name == 'prod') && (github.event_name == 'repository_dispatch' ||
                   (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'))


              env:
                  FTP_SERVER: ${{ secrets.FTP_SERVER }} # e.g. ftp.hsarchitect.id
                  FTP_USERNAME: ${{ secrets.FTP_USERNAME }} # e.g. hsadmin@hsarchitect.id
                  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
              run: |
                  set -euo pipefail
                  sudo apt-get update
                  sudo apt-get install -y lftp
                  lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "
                    set ftp:ssl-force true;
                    set ftp:ssl-protect-data true;
                    set ssl:verify-certificate no;   # remove once cert path is trusted
                    set ftp:passive-mode true;
                    set net:timeout 30;
                    set net:max-retries 2;
                    mirror -R --verbose dist/ public_html/;
                    quit
                  " ftps://$FTP_SERVER:21
